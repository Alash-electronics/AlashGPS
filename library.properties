sentence=Easy GPS library for NEO-6M / NEO-7M / NEO-8M (NMEA): latitude, longitude, altitude, speed, time, satellites, distance. No TinyGPS needed.
paragraph=Reads any NMEA GPS module with a one-line begin(): lat(), lon(), altitude(), speedKmh(), local time (Kazakhstan UTC+5 by default), distanceTo() and bearingTo(). Checks every sentence with its checksum, tells whether the module sends nothing, sends garbage or just has no satellites yet, in Russian, Kazakh or English. Works on Arduino AVR, ESP32 and ESP8266 with built-in libraries only. Examples included, made for classes and kits by Alash Electronics.
